<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kompas Engineering | Quality Management Consulting</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #f4f6f8;
      font-family: Arial, sans-serif;
      color: #1c1c1c;
    }

    .container {
      max-width: 1120px;
      margin: 48px auto;
      background: #ffffff;
      padding: 56px 70px;
      border-radius: 18px;
      box-shadow: 0 12px 34px rgba(0,0,0,0.08);
    }

    .language-switch {
      text-align: right;
      margin-bottom: 28px;
      font-size: 14px;
      color: #64748b;
    }

    .language-switch button {
      background: none;
      border: none;
      color: #64748b;
      font-size: 14px;
      cursor: pointer;
      padding: 6px 8px;
      font-weight: 600;
    }

    .language-switch button:hover,
    .language-switch button.active {
      color: #1da9c1;
    }

    .logo {
      text-align: center;
      margin-bottom: 36px;
    }

    .logo img {
      max-width: 320px;
      width: 100%;
      height: auto;
    }

    .hero {
      text-align: center;
      margin-bottom: 52px;
    }

    h1 {
      font-size: 42px;
      margin: 0 0 14px 0;
      color: #10233f;
      line-height: 1.15;
    }

    .subtitle {
      font-size: 22px;
      color: #1da9c1;
      margin-bottom: 22px;
      font-weight: 600;
    }

    .intro {
      font-size: 19px;
      color: #3f5870;
      line-height: 1.65;
      max-width: 820px;
      margin: 0 auto;
    }

    .section {
      margin-top: 52px;
    }

    .section-title {
      font-size: 26px;
      color: #10233f;
      margin-bottom: 22px;
      font-weight: 700;
    }

    p {
      font-size: 18px;
      line-height: 1.8;
      margin-bottom: 22px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 22px;
    }

    .card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 24px;
    }

    .card h3 {
      margin: 0 0 12px 0;
      font-size: 20px;
      color: #10233f;
    }

    .card p {
      font-size: 16px;
      line-height: 1.65;
      margin: 0;
      color: #334155;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px 42px;
      padding-left: 0;
      list-style: none;
    }

    .grid li {
      font-size: 17px;
      line-height: 1.6;
      padding-left: 18px;
      position: relative;
    }

    .grid li::before {
      content: "•";
      position: absolute;
      left: 0;
      color: #1da9c1;
      font-weight: bold;
    }

    .contact {
      margin-top: 58px;
      padding-top: 34px;
      border-top: 1px solid #d7dde3;
    }

    a {
      color: #1da9c1;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .footer {
      margin-top: 46px;
      font-size: 14px;
      color: #6b7280;
      text-align: center;
      line-height: 1.7;
    }

    @media (max-width: 900px) {
      .container {
        margin: 20px;
        padding: 34px 28px;
      }

      .language-switch {
        text-align: center;
      }

      .logo img {
        max-width: 280px;
      }

      h1 {
        font-size: 34px;
      }

      .subtitle {
        font-size: 20px;
      }

      .intro {
        font-size: 18px;
      }

      .cards {
        grid-template-columns: 1fr;
      }

      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <div class="language-switch">
      <button onclick="setLanguage('en')" id="btn-en" class="active">EN</button> |
      <button onclick="setLanguage('de')" id="btn-de">DE</button> |
      <button onclick="setLanguage('tr')" id="btn-tr">TR</button>
    </div>

    <div class="logo">
      <img src="Kompas Sade Logo.png" alt="Kompas Engineering Logo">
    </div>

    <div class="hero">
      <h1>Kompas Engineering</h1>
      <div class="subtitle" id="subtitle"></div>
      <p class="intro" id="intro"></p>
    </div>

    <div class="section">
      <div class="section-title" id="about-title"></div>
      <p id="about-p1"></p>
      <p id="about-p2"></p>
    </div>

    <div class="section">
      <div class="section-title" id="services-title"></div>

      <div class="cards">
        <div class="card">
          <h3 id="service1-title"></h3>
          <p id="service1-text"></p>
        </div>

        <div class="card">
          <h3 id="service2-title"></h3>
          <p id="service2-text"></p>
        </div>

        <div class="card">
          <h3 id="service3-title"></h3>
          <p id="service3-text"></p>
        </div>

        <div class="card">
          <h3 id="service4-title"></h3>
          <p id="service4-text"></p>
        </div>

        <div class="card">
          <h3 id="service5-title"></h3>
          <p id="service5-text"></p>
        </div>

        <div class="card">
          <h3 id="service6-title"></h3>
          <p id="service6-text"></p>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-title" id="experience-title"></div>
      <ul class="grid" id="experience-list"></ul>
    </div>

    <div class="section">
      <div class="section-title" id="qualifications-title"></div>
      <ul class="grid" id="qualifications-list"></ul>
    </div>

    <div class="contact">
      <div class="section-title" id="contact-title"></div>
      <p>
        <strong>Salih Akyol</strong><br>
        Germany<br><br>
        E-Mail: <a href="mailto:salih@kompas-engineering.de">salih@kompas-engineering.de</a>
      </p>
    </div>

    <div class="footer" id="footer"></div>
  </div>

  <script>

          ["Süreç Yönetimi", "İş süreçlerinin, sorumlulukların ve süreç arayüzlerinin analizi, dokümantasyonu ve iyileştirilmesi."],

          ["Tedarikçi Kalite Geliştirme", "Tedarikçi değerlendirme, tedarikçi geliştirme ve kalite odaklı iletişim konularında destek."]
        ],
        experienceTitle: "Deneyim",
        experience: [
          "Kalite yönetim sistemleri",
          "Süreç yönetimi",
          "İç denetimler",
          "Doküman kontrol sistemleri",
          "Tedarikçi kalite yönetimi",
          "Teknik dokümantasyon",
          "Endüstriyel sızdırmazlık teknolojileri",
          "Kompansatör uygulamaları"
        ],
        qualificationsTitle: "Yetkinlikler",
        qualifications: [
          "Quality Management Professional (QMF-TÜV)",
          "TÜV SÜD Akademie",
          "Endüstriyel kalite yönetimi",
          "Süreç ve yönetim sistemi geliştirme",
          "Uluslararası sanayi deneyimi"
        ],
        contactTitle: "İletişim",
        footer: "Kalite Yönetimi | Yönetim Sistemleri | Süreç İyileştirme<br>© 2026 Kompas Engineering"
      }
    };

    function setLanguage(lang) {
      const data = content[lang];

      document.documentElement.lang = lang;
      document.getElementById("subtitle").innerHTML = data.subtitle;
      document.getElementById("intro").innerHTML = data.intro;
      document.getElementById("about-title").innerHTML = data.aboutTitle;
      document.getElementById("about-p1").innerHTML = data.aboutP1;
      document.getElementById("about-p2").innerHTML = data.aboutP2;
      document.getElementById("services-title").innerHTML = data.servicesTitle;

      data.services.forEach((service, index) => {
        document.getElementById(`service${index + 1}-title`).innerHTML = service[0];
        document.getElementById(`service${index + 1}-text`).innerHTML = service[1];
      });

      document.getElementById("experience-title").innerHTML = data.experienceTitle;
      document.getElementById("experience-list").innerHTML = data.experience.map(item => `<li>${item}</li>`).join("");

      document.getElementById("qualifications-title").innerHTML = data.qualificationsTitle;
      document.getElementById("qualifications-list").innerHTML = data.qualifications.map(item => `<li>${item}</li>`).join("");

      document.getElementById("contact-title").innerHTML = data.contactTitle;
      document.getElementById("footer").innerHTML = data.footer;

      document.getElementById("btn-en").classList.remove("active");
      document.getElementById("btn-de").classList.remove("active");
      document.getElementById("btn-tr").classList.remove("active");
      document.getElementById(`btn-${lang}`).classList.add("active");
    }

    setLanguage("en");
  </script>
</body>
</html>
